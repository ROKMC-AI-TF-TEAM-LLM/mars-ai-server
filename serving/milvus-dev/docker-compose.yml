# 개발용 Milvus standalone (Windows 전용).
#
# Windows에는 milvus-lite 휠이 없어 임베디드 모드를 쓸 수 없다. 운영 L40과
# WSL은 이 파일이 필요 없다 — Milvus Lite 파일 경로를 그대로 쓴다.
#
#   docker compose -f serving/milvus-dev/docker-compose.yml up -d
#   MILVUS_LITE_PATH=http://localhost:19530     (.env)
#
# scripts/dev_setup.ps1 [5/5]의 docker run과 **같은 컨테이너를 만든다**
# (이름·이미지·볼륨 동일). 둘 중 아무거나 써도 되고, 섞어 써도 데이터가
# 갈리지 않는다. 이 파일은 재현·수정이 쉬운 쪽이다.
#
# ⚠️ 서버 모드는 Lite와 동작이 다르다. 여기서 통과한 것이 운영에서 통과한다는
#    보장이 없다 (docs/troubleshooting.md ⑩⑪ — HNSW 수용 여부, PK 키 위치).
#    최종 검증은 반드시 Lite 환경(WSL 또는 L40)에서 한다.

services:
  milvus:
    # 에어갭: 인터넷 되는 곳에서 `docker save`로 tar를 만들어 반입한다.
    # pymilvus==2.5.4와 맞춘 태그다. 한쪽만 올리지 않는다
    image: milvusdb/milvus:v2.5.4
    container_name: ax-milvus-dev
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      # standalone은 etcd를 컨테이너 안에 내장해 띄운다 — 별도 etcd·MinIO
      # 컨테이너가 필요 없다. 그래서 에어갭 반입이 **이미지 1개**로 끝난다
      ETCD_USE_EMBED: "true"
      ETCD_DATA_DIR: /var/lib/milvus/etcd
      ETCD_CONFIG_PATH: /milvus/configs/embedEtcd.yaml
      COMMON_STORAGETYPE: local
    volumes:
      # 설정은 저장소 원본을 직접 마운트한다 (복사 단계 불필요).
      # ⚠️ 없는 파일을 파일로 마운트하면 Docker가 **빈 디렉터리**를 만들고
      #    Milvus가 설정을 못 읽는다 — 그래서 사본이 아니라 원본을 건다
      - ./embedEtcd.yaml:/milvus/configs/embedEtcd.yaml
      - ./user.yaml:/milvus/configs/user.yaml
      # 데이터는 dev_setup.ps1과 같은 경로 — 둘을 섞어 써도 갈리지 않는다
      - ../../data/milvus-docker/data:/var/lib/milvus
    ports:
      # 에어갭 규칙: 127.0.0.1에만 바인딩한다. 0.0.0.0으로 열면 내부망의
      # 다른 호스트에서 인증 없이 벡터DB를 읽을 수 있다 — 문서 본문이
      # 그대로 노출되므로 ACL을 앱에서 강제하는 의미가 사라진다
      - "127.0.0.1:19530:19530"
      - "127.0.0.1:9091:9091"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    restart: unless-stopped
